name: 🧪 run-dependency-checks

on:
  workflow_dispatch:
  schedule:
  - cron: "1 0 * * FRI"

permissions:
  contents: read

jobs:
  run-dependency-checks-rust:
    name: run-dependency-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/checkout@v6

      - name: Install cargo-upgrades
        run: cargo install cargo-upgrades

      - name: Check if dependencies are up-to-date
        run: cargo upgrades
