name: 🧪 run-examples

on:
  workflow_dispatch:
  schedule:
  - cron: "1 0 * * FRI"

permissions:
  contents: read

jobs:
  run-examples:
    name: run-examples
    runs-on: ubuntu-24.04
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/checkout@v6

      - name: Install cargo-templated-examples
        run: cargo install cargo-templated-examples

      - name: Run templated examples
        run: cargo templated-examples
