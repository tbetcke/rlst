name: 🧪 run-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests-rust:
    name: run-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/checkout@v6

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libfftw3-dev libopenblas-dev \
            openmpi-bin libopenmpi-dev libsuitesparse-dev

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: |
          cargo clippy -- -D warnings
          cargo clippy --examples -- -D warnings
          cargo clippy --features "mpi,fftw,fftw_system,strict" -- -D warnings
          cargo clippy --examples --features "mpi,fftw,fftw_system,strict" -- -D warnings
          cargo clippy --features "openblas_threading,mkl_threading,blis_threading,strict" -- -D warnings
          cargo clippy -p rlst-suitesparse -- -D warnings

      - name: Run unit tests
        run: |
          RUST_MIN_STACK=8388608 cargo test --features "mpi,fftw,fftw_system,strict"
          cargo test -p rlst-suitesparse

      - name: Run bounded empty-rank MPI regressions (1, 2, and 4 ranks)
        run: python3 scripts/run_mpi_tests.py

      - name: Build docs
        run: cargo doc --no-deps --features "mpi,fftw,fftw_system,strict"
