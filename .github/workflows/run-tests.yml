name: 🧪 run-tests

# Temporary, on a throwaway branch: the Linux benchmark of issue #44 (as DC53). Not for merging.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bench:
    name: bench-44
    runs-on: ubuntu-24.04
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenblas-dev

      - name: Report machine and FFTW
        run: |
          pkg-config --modversion fftw3
          grep -m1 'model name' /proc/cpuinfo
          nproc

      - name: Build the benchmark before (origin/main) and after (this branch's parent)
        run: |
          git worktree add "$RUNNER_TEMP/before" origin/main
          git worktree add "$RUNNER_TEMP/after" HEAD~1
          for v in before after; do
            (cd "$RUNNER_TEMP/$v" && cargo build --release --example fftw_bench --features fftw_system \
              && cp target/release/examples/fftw_bench "$RUNNER_TEMP/bench_$v")
          done

      - name: Run, alternating
        run: |
          for run in 1 2; do
            for v in before after; do
              echo "::group::$v, run $run"
              "$RUNNER_TEMP/bench_$v" | tee "$RUNNER_TEMP/out_${v}_$run.md"
              echo "::endgroup::"
            done
          done
          for run in 1 2; do
            for v in before after; do
              {
                echo "## $v, run $run"
                grep -E '^\| [0-9]+ \| one plan, batch of 9(, on slices)? \|' "$RUNNER_TEMP/out_${v}_$run.md"
              } >> "$GITHUB_STEP_SUMMARY"
            done
          done
