[package]
name = "rlst"
version = "0.12.0"
authors = ["The rlst contributors"]
edition = "2024"
description = "A Rust native linear algebra library."
readme = "../README.md"
license = "MIT / Apache-2.0"
repository = "https://github.com/tbetcke/rlst"
keywords = ["numerics"]
categories = ["mathematics", "science"]

[lib]
name = "rlst"

# docs.rs builds the MPI and FFTW interfaces too, FFTW threads included; `mpi-sys` builds
# against the MPICH and libclang of the docs.rs image, `build.rs` skips FFTW discovery there
# (`DOCS_RS`), and `--cfg docsrs` marks the feature-gated items.
[package.metadata.docs.rs]
features = ["mpi", "fftw", "fftw_system", "fftw_threads"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rlst-proc-macro = { path = "../proc-macro", version = "0.12.0" }
num = { version = "0.4", features = ["serde", "rand"] }
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
itertools = "0.15"
blas = "0.23"
lapack = "0.20"
thiserror = "2"
serde = "1"
log = { version = "0.4", optional = true }
typenum = { version = "1", features = ["const-generics"]}
paste = "1"
aligned-vec = "0.6"

num_cpus = "1"

mpi = { version = "0.8.2", optional = true , features = ["derive","complex"]}
mpi-sys = { version = "0.2.4", optional = true }

fftw-sys = { version = "0.8", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
burn = { version = "0.22", default-features = false, optional = true }

[dev-dependencies]
approx = { version = "0.5", features = ["num-complex"] }
rand = "0.10"
paste = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
blas-src = { version = "0.14", features = ["accelerate"]}
lapack-src = { version = "0.13", features = ["accelerate"]}

[target.'cfg(target_os = "linux")'.dev-dependencies]
openblas-src = { version = "0.10", features = ["system"]}
lapack-src = { version = "0.13", features = ["openblas"]}
blas-src = { version = "0.14", features = ["openblas"] }

[build-dependencies]
pkg-config = { version = "0.3", optional = true }

[features]
strict = []
default = []
mpi = ["dep:mpi", "dep:mpi-sys"]
nightly = []
# Link BLAS thread-control functions directly. Only needed for statically linked
# libraries or targets other than Linux and macOS; see `rlst::threading`.
blis_threading = []
openblas_threading = []
mkl_threading = []
burn = ["dep:burn"]
enable_tracing = ["rlst-proc-macro/enable_tracing", "dep:log"]
# FFTW transforms, through the system's FFTW (`fftw_system`, the only back end).
# WARNING: FFTW is licensed under the GNU General Public License (version 2 or later).
# This feature links FFTW and the GPL-licensed fftw-sys bindings: RLST itself is
# MIT / Apache-2.0, but distributing a program built with it is subject to the GPL
# unless you hold a non-free FFTW licence from MIT's Technology Licensing Office.
# Cargo enables a feature for the whole build when any crate requests it, so check
# your graph (`cargo tree -e features`). Off by default. Not legal advice; see the
# README for the full warning.
fftw = ["dep:fftw-sys", "dep:libc"]
fftw_system = ["fftw", "fftw-sys/system", "dep:pkg-config"]
# Threaded FFTW plans (`Planner::threads`): also links FFTW's threads libraries,
# `fftw3_threads` and `fftw3f_threads`, and needs FFTW 3.3.6 or later.
fftw_threads = ["fftw_system"]


[lints.clippy]
wildcard_imports = "forbid"


[[test]]
name = "mpi"
path = "tests/mpi/main.rs"
harness = false
required-features = ["mpi"]

[[test]]
name = "fftw_determinism"
harness = false
required-features = ["fftw"]

[[test]]
name = "fftw_check_allocations"
harness = false
required-features = ["fftw"]

[[example]]
name = "array_tools"
required-features = ["mpi"]

[[example]]
name = "parallel_sort"
required-features = ["mpi"]

[[example]]
name = "distributed_array"
required-features = ["mpi"]

[[example]]
name = "ghost_communicator"
required-features = ["mpi"]

[[example]]
name = "distributed_csr_matrix"
required-features = ["mpi"]

[[example]]
name = "distributed_array_operations"
required-features = ["mpi"]

[[example]]
name = "fftw_bench"
required-features = ["fftw"]
